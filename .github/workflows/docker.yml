name: Build and publish BTN

on:
  push:
    branches: [alpha]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: btn-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out alpha
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/meet763/btn-api:latest
            ghcr.io/meet763/btn-api:${{ github.sha }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: true
          tags: |
            ghcr.io/meet763/btn-web:latest
            ghcr.io/meet763/btn-web:${{ github.sha }}

